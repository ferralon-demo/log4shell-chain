name: prove

# Log4shell-chain CI — HONEST about what runs where.
#
# This repo's target is JAVA (org.apache.logging.log4j:log4j-core). The Tegron
# OSS scanner's `baseline` verb is GO-ONLY (it requires a go.mod target), so --
# unlike the Go (Gogs) demo -- there is NO in-repo OSS scan here, and this
# workflow does NOT run one. There is also no `bin/tegron prove` / `assert` CLI:
# the OSS scanner verbs are baseline | pr-inherit | cve-watch | state only, and
# the Prove tier (PoE/PoNE, sandbox detonation, two-trace) runs PLATFORM-SIDE
# (with-account), not in repo CI.
#
# So this workflow does exactly two honest things:
#   1. build-reproducers -- builds each per-Case reproducer image to prove the
#      reproducers are real and buildable (real work, in-repo).
#   2. chain -- writes the three Cases' PoE -> incomplete-patch -> PoNE chain to
#      the job summary and documents that the PROVEN verdicts + two-trace come
#      from Tegron's platform Prove tier (Java plugin, Phase 2), which consumes
#      cases/*.yaml + the reproducer images + the collaborator.
#
# We deliberately do NOT invoke a nonexistent prove/assert step.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-reproducers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Case A — JNDI RCE (CVE-2021-44228 / -45046)
          - { case: caseA, checkpoint: vulnerable,  version: "2.14.1" }
          - { case: caseA, checkpoint: failed_fix,  version: "2.15.0" }
          - { case: caseA, checkpoint: real_fix,    version: "2.16.0" }
          # Case B — uncontrolled-recursion DoS (CVE-2021-45105)
          - { case: caseB, checkpoint: vulnerable,  version: "2.16.0" }
          - { case: caseB, checkpoint: real_fix,    version: "2.17.0" }
          # Case C — JDBC Appender config RCE (CVE-2021-44832)
          - { case: caseC, checkpoint: vulnerable,  version: "2.17.0" }
          - { case: caseC, checkpoint: real_fix,    version: "2.17.1" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build reproducer image (${{ matrix.case }} / ${{ matrix.checkpoint }} / log4j ${{ matrix.version }})
        # continue-on-error: historic Maven artifact + JDK 8 base builds can be
        # finicky (Maven Central availability, plugin pinning). A build failure
        # here does not invalidate the chain -- the proven verdicts come from the
        # platform Prove tier, not this build -- but a green build is the honest
        # in-repo evidence that the reproducer is real.
        continue-on-error: true
        run: |
          docker build \
            -f reproducer/${{ matrix.case }}/Dockerfile.${{ matrix.checkpoint }} \
            -t repro-${{ matrix.case }}:${{ matrix.checkpoint }} \
            reproducer/${{ matrix.case }}

      - name: Build the controlled collaborator (once is enough; cheap to repeat)
        continue-on-error: true
        run: docker build -t collaborator:latest reproducer/collaborator

  chain:
    needs: build-reproducers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the PoE -> incomplete-patch -> PoNE chain
        run: |
          {
            echo "# Log4Shell family — Tegron PoE → incomplete-patch → PoNE chains"
            echo
            echo "Target: \`pkg:maven/org.apache.logging.log4j/log4j-core\` (Java)."
            echo
            echo "> The OSS scanner \`baseline\` is **Go-only**, so there is no in-repo"
            echo "> OSS scan for this Java target. The **proven** PoE/PoNE verdicts and the"
            echo "> two-trace below are produced by **Tegron's platform Prove tier** (Java"
            echo "> plugin, Phase 2, with-account), which consumes \`cases/*.yaml\` + the"
            echo "> reproducer images built above + the controlled collaborator. This CI"
            echo "> only proves the reproducers build and documents the chain."
            echo
            echo "## Case A — JNDI RCE (CVE-2021-44228, also CVE-2021-45046)"
            echo
            echo "| Role | Version | Git ref | Commit | Expected verdict |"
            echo "|---|---|---|---|---|"
            echo "| vulnerable | 2.14.1 | rel/2.14.1 | d2d40d51 | proven exploitable (PoE) |"
            echo "| failed_fix | 2.15.0 | rel/2.15.0 | 636ce10d | incomplete-patch, conditional-on([non_default_pattern_layout]) (PoE) |"
            echo "| real_fix | 2.16.0 | rel/2.16.0 | 70638718 | proven not_exploitable (PoNE) |"
            echo
            echo "## Case B — uncontrolled-recursion DoS (CVE-2021-45105)"
            echo
            echo "| Role | Version | Git ref | Commit | Expected verdict |"
            echo "|---|---|---|---|---|"
            echo "| vulnerable | 2.16.0 | rel/2.16.0 | 70638718 | proven exploitable (PoE) |"
            echo "| real_fix | 2.17.0 | rel/2.17.0 | 8285c82d | proven not_exploitable (PoNE) |"
            echo
            echo "## Case C — JDBC Appender config RCE (CVE-2021-44832)"
            echo
            echo "| Role | Version | Git ref | Commit | Expected verdict |"
            echo "|---|---|---|---|---|"
            echo "| vulnerable | 2.17.0 | rel/2.17.0 | 8285c82d | proven exploitable, conditional-on([attacker_controlled_logging_config]) (PoE) |"
            echo "| real_fix | 2.17.1 | rel/2.17.1 | d1c64aa4 | proven not_exploitable, conditional-on([attacker_controlled_logging_config]) (PoNE) |"
            echo
            echo "**Why per-Case:** 2.16.0 closes the JNDI RCE class (Case A real_fix) but"
            echo "is the Case B *vulnerable* build — a fix that trades one vuln class for"
            echo "another. Each CVE is its own Case so the chains stay honest."
          } >> "$GITHUB_STEP_SUMMARY"
